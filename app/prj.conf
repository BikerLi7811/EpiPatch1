# Battery build (default). For logs/profiling add:  -DEXTRA_CONF_FILE=debug.conf

# The detector (selects PDM/DMIC, FPU, CMSIS-DSP, CMSIS-NN, full libstdc++)
CONFIG_WHEEZE_DETECTOR=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y

# ---- power ----
# A running UART (console/logging) draws more than the entire detector, and
# keeps the high-frequency clock requested. Compile all of it out.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
# Let drivers suspend peripherals that are not in use
CONFIG_PM_DEVICE=y
