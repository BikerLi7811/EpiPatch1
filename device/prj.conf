# EpiPatch chest patch. Battery build: no UART, no logging.
# Use debug.conf for logs over RTT.

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# microphone wheeze detector (../wheeze module)
CONFIG_WHEEZE_DETECTOR=y

# vital-sign filters (biquads on the FPU)
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_WATCHDOG=y
CONFIG_EVENTS=y
# own register-level drivers; keep Zephyr's sensor drivers out
CONFIG_SENSOR=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=4
CONFIG_PM_DEVICE=y

# Bluetooth LE link to the thigh patch: central + GATT client, one bonded
# peer, LE Secure Connections only, bond kept in RRAM
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="EpiPatch-C"

# Bluetooth bond in RRAM
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# The mic listens only when the sampling schedule asks (wheeze_listen()) or
# while a wheeze is going on; its own duty cycle is effectively off.
CONFIG_WHEEZE_DUTY_SLEEP_MS=3600000
