# west build ... -- -DEXTRA_CONF_FILE=debug.conf
# Logs over UART. The overlay's pin map uses the DK's VCOM pins, so for logs
# switch to RTT instead (CONFIG_USE_SEGGER_RTT + CONFIG_LOG_BACKEND_RTT) or remap.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_APP_LOG_LEVEL_INF=y
